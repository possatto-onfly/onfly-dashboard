<style>
:root { color-scheme: light; --blue:#0064FF; --blue-light:#E8F0FE; --dark:#1a1a2e; --gray:#6b7280; --gray-light:#f3f4f6; --border:#e5e7eb; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f8f9fc;color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.header{background:white;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;color:var(--blue)}
.logo span{font-weight:400;color:var(--gray);font-size:13px}
.header-controls{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
select,input[type="month"],input[type="date"],input[type="text"],textarea{padding:7px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:white;color:var(--dark);font-family:inherit;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,100,255,.1)}
#airline-select{min-width:220px;font-weight:500;cursor:pointer}
.btn{padding:7px 15px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:white}
.btn-primary:hover{background:#0052cc}
.btn-outline{background:white;color:var(--blue);border:1px solid var(--blue)}
.btn-outline:hover{background:var(--blue-light)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{background:white;color:#ef4444;border:1px solid #ef4444}
.tabs-nav{display:flex;background:white;border-bottom:1px solid var(--border);padding:0 20px;gap:2px}
.tab-btn{padding:11px 18px;background:none;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:500;color:var(--gray);cursor:pointer;transition:all .15s}
.tab-btn:hover{color:var(--blue)}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.main{padding:20px;max-width:1100px;margin:0 auto}
.tab-panel{display:none}.tab-panel.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:white;border-radius:10px;padding:18px;border:1px solid var(--border)}
.kpi-label{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:26px;font-weight:700;line-height:1.1}
.kpi-sub{font-size:11px;color:var(--gray);margin-top:3px}
.card{background:white;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:13px;font-weight:600}
.card-body{padding:18px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;background:var(--gray-light);font-weight:600;color:var(--gray);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray-light)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.form-group textarea{resize:vertical;min-height:72px;width:100%}
.form-group input,.form-group select{width:100%}
.visit-item{border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:12px;background:white}
.visit-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.visit-date-badge{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-light);padding:3px 8px;border-radius:4px}
.visit-location{font-size:12px;color:var(--gray);margin-top:2px}
.visit-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;background:var(--gray-light);color:var(--gray);padding:2px 8px;border-radius:20px;font-weight:500}
.tag-blue{background:var(--blue-light);color:var(--blue)}
.vf{margin-top:10px}
.vf-label{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--gray);letter-spacing:.5px;margin-bottom:2px}
.vf-value{font-size:13px;line-height:1.5}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:14px;padding:22px;width:100%;max-width:580px;margin:auto}
.modal-title{font-size:15px;font-weight:700;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.note-item{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:white}
.note-date{font-size:11px;color:var(--gray);margin-bottom:3px}
.note-title{font-size:14px;font-weight:600;margin-bottom:6px}
.note-content{font-size:13px;color:var(--gray);line-height:1.5}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--gray);gap:10px;font-size:14px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px 20px;color:var(--gray)}
.empty-state .icon{font-size:38px;margin-bottom:10px}
.chart-container{position:relative;height:220px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:640px){.charts-grid{grid-template-columns:1fr}}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#d1fae5;color:#065f46}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.contact-row{display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr 28px;gap:6px;margin-bottom:6px;align-items:center}
.contact-row input{padding:5px 9px;font-size:12px}
.icon-btn{width:26px;height:26px;border:none;background:none;cursor:pointer;color:var(--gray);display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:15px}
.icon-btn:hover{color:#ef4444;background:#fee2e2}
.section-title{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;margin-top:18px}
.section-title:first-child{margin-top:0}
hr.divider{border:none;border-top:1px solid var(--border);margin:18px 0}

<div class="header">
  <div class="logo">✈ CRM Aéreo <span>/ Sourcing Onfly</span></div>
  <div class="header-controls" style="display:none">
    <select id="airline-select"></select>
    <input type="month" id="from-month" />
    <input type="month" id="to-month" />
  </div>
</div>

<div class="tabs-nav">
  <button class="tab-btn active" data-tab="transacional" onclick="switchTab('transacional')">📊 Transacional</button>
  <button class="tab-btn" data-tab="perfil" onclick="switchTab('perfil')">🏢 Perfil</button>
  <button class="tab-btn" data-tab="visitas" onclick="switchTab('visitas')">📋 Visitas</button>
  <button class="tab-btn" data-tab="mercado" onclick="switchTab('mercado')">🌐 Mercado</button>
</div>

<div class="main">
  <div id="tab-transacional" class="tab-panel active">
    <div id="transacional-content"><div class="empty-state"><div class="icon">✈️</div><p>Selecione uma cia aérea e clique em <strong>Atualizar</strong></p></div></div>
  </div>
  <div id="tab-perfil" class="tab-panel">
    <div id="perfil-content"><div class="empty-state"><div class="icon">🏢</div><p>Selecione uma cia aérea</p></div></div>
  </div>
  <div id="tab-visitas" class="tab-panel">
    <div id="visitas-content"><div class="empty-state"><div class="icon">📋</div><p>Selecione uma cia aérea</p></div></div>
  </div>
  <div id="tab-mercado" class="tab-panel">
    <div id="mercado-content"><div class="empty-state"><div class="icon">🌐</div><p>Selecione uma cia aérea</p></div></div>
  </div>
</div>

<!-- Modal Visita -->
<div class="modal-overlay" id="visit-modal">

    <div class="form-grid" style="margin-bottom:10px;grid-template-columns:1fr 1fr 1fr">
      <div class="form-group"><label>Data *</label><input type="date" id="v-date" required /></div>
      <div class="form-group"><label>Início</label><input type="time" id="v-start" value="09:00" /></div>
      <div class="form-group"><label>Fim</label><input type="time" id="v-end" value="10:00" /></div>
    </div>
    <div class="form-group" style="margin-bottom:8px">
      <label>Local</label><input type="text" id="v-local" placeholder="Cidade, sede..." />
    </div>
    <div class="form-grid" style="margin-bottom:4px">
      <div class="form-group"><label>Participantes Onfly <span style="font-weight:400;color:var(--gray);font-size:11px">(separe por vírgula)</span></label><input type="text" id="v-onfly" placeholder="Rodrigo, Ana..." /></div>
      <div class="form-group"><label>Participantes Cia <span style="font-weight:400;color:var(--gray);font-size:11px">(separe por vírgula)</span></label><input type="text" id="v-cia" placeholder="João Silva, Maria Costa..." /></div>
    </div>
    <div style="margin-bottom:12px">
      <button type="button" class="btn btn-outline btn-sm" onclick="lookupAttendees()" id="v-lookup-btn">🔍 Buscar emails dos participantes</button>
      <div id="v-attendee-results" style="margin-top:8px;display:none"></div>
      <input type="hidden" id="v-cia-emails" />
    </div>
    <div class="form-group" style="margin-bottom:10px"><label>Pauta / Agenda</label><textarea id="v-pauta" placeholder="Principais tópicos..."></textarea></div>
    <div class="form-group" style="margin-bottom:10px"><label>Resultados / Acordos</label><textarea id="v-resultados" placeholder="Decisões tomadas..."></textarea></div>
    <div class="form-group" style="margin-bottom:10px"><label>Próximos Passos</label><textarea id="v-proximos" placeholder="Ações, responsáveis, prazos..."></textarea></div>
    <div class="form-grid">
      <div class="form-group"><label>Follow-up</label><input type="date" id="v-followup" /></div>
      <div class="form-group"><label>Status</label><select id="v-status"><option value="realizada">Realizada</option><option value="planejada">Planejada</option><option value="cancelada">Cancelada</option></select></div>
    </div>
    <input type="hidden" id="v-edit-id" />
    <div style="margin-top:14px;padding:12px;background:var(--gray-light);border-radius:8px;display:flex;gap:20px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer"><input type="checkbox" id="v-calendar" checked /> 📅 Criar evento no Google Calendar</label>
      <label style="display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer"><input type="checkbox" id="v-meet" /> 🎥 Incluir Google Meet</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeVisitModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveVisit()">Salvar Visita</button>
    </div>
  </div>
</div>

<!-- Modal Mercado -->
<div class="modal-overlay" id="market-modal">
  <div class="modal">
    <div class="modal-title">🌐 Informação de Mercado <button class="icon-btn" onclick="closeMarketModal()">✕</button></div>
    <div class="form-group" style="margin-bottom:12px">
      <label>URL da Notícia</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="m-source" placeholder="Cole o link aqui..." style="flex:1" onpaste="setTimeout(autoFillFromUrl,150)" />
        <button id="autofill-btn" class="btn btn-primary btn-sm" onclick="autoFillFromUrl()" style="white-space:nowrap">✨ Auto-preencher</button>
      </div>
      <div id="autofill-loading" style="display:none;font-size:12px;color:var(--blue);margin-top:6px">⏳ Analisando URL...</div>
    </div>
    <div class="form-group" style="margin-bottom:10px"><label>Título *</label><input type="text" id="m-title" placeholder="Ex: Novo acordo codeshare..." /><div id="autofill-status" style="font-size:11px;margin-top:4px;display:none"></div></div>
    <div class="form-grid" style="margin-bottom:10px">
      <div class="form-group"><label>Categoria</label>
        <select id="m-cat">
          <option value="acordo">🤝 Acordo / Incentivo</option>
          <option value="expansao">✈️ Expansão / Rotas</option>
          <option value="financeiro">💰 Resultado financeiro</option>
          <option value="concorrencia">⚔️ Concorrência</option>
          <option value="regulatorio">⚖️ Regulatório</option>
          <option value="outro">📌 Outro</option>
        </select>
      </div>
      <div class="form-group"><label>Data</label><input type="date" id="m-date" /></div>
    </div>
    <div class="form-group" style="margin-bottom:10px"><label>Conteúdo *</label><textarea id="m-content" style="min-height:110px" placeholder="Descreva o contexto e impacto..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeMarketModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveMarketNote()">Salvar</button>
    </div>
  </div>
</div>

// ── Seed key matching ──────────────────────────────────
function findSeedKey(airlineName){
  if(!airlineName) return null;
  const u=airlineName.toUpperCase().trim();
  if(SEED_DATA[u]) return u;
  for(const key of Object.keys(SEED_DATA)){
    if(u.includes(key) || key.split(' ').some(w=>w.length>2&&u.includes(w))) return key;
  }
  return null;
}

// ── State ──────────────────────────────────────────────
let currentAirline = null;
let trendChart = null, splitChart = null, channelChart = null;

// ── Canal categorization ───────────────────────────────
function catConsol(c, selectedAirline){
  if(!c) return 'Desconhecido';
  const u=c.toUpperCase().trim();
  const sel=(selectedAirline||'').toUpperCase().trim();
  if(u.includes('AMADEUS')) return 'GDS (Amadeus)';
  if(u.startsWith('IATA')) return 'IATA / Acordo';
  if(u==='GRUPOS-EVENTOS') return 'Grupos & Eventos';
  if(u.includes('FLYTOUR')||u.includes('REXTUR')||u.includes('CONFIA')||u==='BRT'||u.includes('SAKURA')||u==='CONSOLID'||u.includes('WOOBA')||u==='FLIGHT'||u==='CONSOLIDAMADEUS') return 'Consolidador';
  const selWords=sel.split(/\s+/);
  if(sel && selWords.some(w=>w.length>2 && u.includes(w))) return 'Direto (Cia)';
  const airlines=['LATAM','AZUL','GOL','DELTA','AVIANCA','COPA','TAP','KLM','IBERIA','EMIRATES','QATAR','UNITED','AMERICAN','AEROLINEAS','VIVA','VOLARIS','AEROVIAS','LAN','AIR FRANCE','LUFTHANSA','LUFHANSA'];
  if(airlines.some(a=>u.includes(a))) return 'Codeshare / Outra Cia';
  return 'Outros';
}
const catColors={'Direto (Cia)':'#0064FF','GDS (Amadeus)':'#f59e0b','Consolidador':'#10b981','IATA / Acordo':'#8b5cf6','Grupos & Eventos':'#ec4899','Codeshare / Outra Cia':'#06b6d4','Desconhecido':'#9ca3af','Outros':'#6b7280'};

// ── localStorage ───────────────────────────────────────
const CRM_KEY = 'crm_aereo_v1';
function getCRM(){ try{ return JSON.parse(localStorage.getItem(CRM_KEY)||'{}'); }catch{ return {}; } }
function saveCRM(d){ localStorage.setItem(CRM_KEY, JSON.stringify(d)); }
function getAD(a){
  const c=getCRM();
  const d=c[a];
  const isEmpty=!d || (!d.profile?.iata && !d.profile?.contacts?.length && !d.visits?.length);
  if(isEmpty){
    const sk=findSeedKey(a);
    c[a]= sk && SEED_DATA[sk] ? JSON.parse(JSON.stringify(SEED_DATA[sk])) : {profile:{},visits:[],market:[]};
    saveCRM(c);
  }
  return c[a];
}
function saveAD(a,d){ const c=getCRM(); c[a]=d; saveCRM(c); }

// ── BQ (dados pré-carregados pelo Streamlit) ───────────
async function bq(sql){
  const d = (window.__CRM__ || {}).transacional || {};
  if(sql.includes('avg_t'))                        return d.stats    || [];
  if(sql.includes('origin_destination_'))           return d.routes   || [];
  if(sql.includes('FORMAT_DATE'))                   return d.trend    || [];
  if(sql.includes('COALESCE(TRIM(consolidator)'))   return d.channels || [];
  if(sql.includes('total_mundo'))                   return d.totals   || [];
  if(sql.includes("IN ('GOL','AZUL','LATAM')"))     return d.nationals|| [];
  return [];
}

// ── Format helpers ─────────────────────────────────────
function fmtM(v){ if(!v) return 'R$ 0'; const n=parseFloat(v); if(n>=1e6) return 'R$ '+(n/1e6).toFixed(1)+'M'; if(n>=1e3) return 'R$ '+(n/1e3).toFixed(0)+'k'; return 'R$ '+n.toFixed(0); }
function fmtN(v){ return v ? parseInt(v).toLocaleString('pt-BR') : '0'; }
function fmtD(d){ if(!d) return ''; return new Date(d+'T12:00:00').toLocaleDateString('pt-BR'); }
function esc(s){ return (s||'').replace(/'/g,"\\'"); }

// ── Period ─────────────────────────────────────────────
function initPeriod(){
  const now=new Date();
  const to=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const fd=new Date(now.getFullYear(), now.getMonth()-5, 1);
  const from=`${fd.getFullYear()}-${String(fd.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('from-month').value=from;
  document.getElementById('to-month').value=to;
}
function getPeriod(){
  const from=document.getElementById('from-month').value;
  const to=document.getElementById('to-month').value;
  const [ty,tm]=to.split('-').map(Number);
  const lastDay=new Date(ty,tm,0).getDate();
  return { fromDate:from+'-01', toDate:`${to}-${lastDay}` };
}

// ── Tabs ───────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  if(!currentAirline) return;
  if(tab==='perfil') renderPerfil();
  if(tab==='visitas') renderVisitas();
  if(tab==='mercado') renderMercado();
}

// ── Load Airlines ──────────────────────────────────────
async function loadAirlines(){
  const sel=document.getElementById('airline-select');
  try{
    const rows=await bq(`
      SELECT TRIM(standard_airline) as a, COUNT(DISTINCT protocol) as c
      FROM \`dw-onfly-prd.travel_core.silver_flight_orders\`
      WHERE partition_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH)
        AND standard_airline IS NOT NULL
      GROUP BY 1 ORDER BY 2 DESC LIMIT 35`);
    sel.innerHTML='<option value="">— Selecione uma cia aérea —</option>';
    rows.forEach(r=>{ const o=document.createElement('option'); o.value=r.a; o.textContent=`${r.a} (${fmtN(r.c)} tickets)`; sel.appendChild(o); });
  }catch(e){
    console.error('[loadAirlines]',e);
    sel.innerHTML=`<option value="">Erro: ${e.message}</option>`;
  }
  sel.onchange=e=>{
    currentAirline=e.target.value||null;
    if(!currentAirline) return;
    const at=document.querySelector('.tab-btn.active')?.dataset.tab;
    if(at==='transacional') loadTransacional();
    else if(at==='perfil') renderPerfil();
    else if(at==='visitas') renderVisitas();
    else if(at==='mercado') renderMercado();
  };
}

  try{

      bq(`SELECT COALESCE(NULLIF(TRIM(origin_destination_),''),CONCAT(TRIM(origin),'-',TRIM(destination))) as rota, COUNT(DISTINCT protocol) as t, ROUND(SUM(COALESCE(onfly_amount_currency_brl,onfly_amount)-COALESCE(amount_taxes_v3_currency_brl,amount_taxes_v3,0)),2) as net, COUNTIF(is_international=TRUE) as intl FROM \`dw-onfly-prd.travel_core.silver_flight_orders\` WHERE ${w} GROUP BY 1 ORDER BY 2 DESC LIMIT 12`),
      bq(`SELECT FORMAT_DATE('%Y-%m',DATE(purchase_date)) as mo, COUNT(DISTINCT protocol) as t, ROUND(SUM(COALESCE(onfly_amount_currency_brl,onfly_amount)-COALESCE(amount_taxes_v3_currency_brl,amount_taxes_v3,0)),2) as net FROM \`dw-onfly-prd.travel_core.silver_flight_orders\` WHERE ${w} GROUP BY 1 ORDER BY 1`),
      bq(`SELECT COALESCE(TRIM(consolidator),'Desconhecido') as consolidator, COUNT(DISTINCT protocol) as t, ROUND(SUM(COALESCE(onfly_amount_currency_brl,onfly_amount)-COALESCE(amount_taxes_v3_currency_brl,amount_taxes_v3,0)),2) as net FROM \`dw-onfly-prd.travel_core.silver_flight_orders\` WHERE ${w} GROUP BY 1 ORDER BY 2 DESC`),
      bq(`SELECT ROUND(SUM(COALESCE(total_amount_currency_brl,total_amount)),2) as total_mundo, ROUND(SUM(CASE WHEN is_international=FALSE OR is_international IS NULL THEN COALESCE(total_amount_currency_brl,total_amount) ELSE 0 END),2) as total_br FROM \`dw-onfly-prd.travel_core.silver_flight_orders\` WHERE ${wDate}`),
      bq(`SELECT TRIM(standard_airline) as cia, ROUND(SUM(CASE WHEN is_international=FALSE OR is_international IS NULL THEN COALESCE(total_amount_currency_brl,total_amount) ELSE 0 END),2) as gmv_br FROM \`dw-onfly-prd.travel_core.silver_flight_orders\` WHERE TRIM(standard_airline) IN ('GOL','AZUL','LATAM') AND ${wDate} GROUP BY 1`)
    ]);
    const s=stats[0]||{};
    const tickets=parseInt(s.tickets||0), net=parseFloat(s.net||0), avgT=parseFloat(s.avg_t||0);
    const dom=parseInt(s.dom||0), intl=parseInt(s.intl||0);
    const agreePct=tickets?(parseInt(s.agree||0)/tickets*100).toFixed(2):0;
    const intlPct=tickets?(intl/tickets*100).toFixed(2):0;

    const isNational=['GOL','AZUL','LATAM'].some(n=>a.toUpperCase().includes(n));
    let shareBr='—';

    } else {
      if(totalBr&&domGmv) shareBr=((domGmv/totalBr)*100).toFixed(2)+'%';
    }
    const shareMundo=(airlineGmv&&totalMundo)?((airlineGmv/totalMundo)*100).toFixed(2)+'%':'—';

async function lookupAttendees(){
  if(!window.cowork){ alert('⚠️ Busca de e-mails disponível apenas no ambiente cowork.'); return; }
  const onlyNames=document.getElementById('v-onfly').value.split(',').map(s=>s.trim()).filter(Boolean);
  const ciaNames=document.getElementById('v-cia').value.split(',').map(s=>s.trim()).filter(Boolean);
  const allNames=[...onlyNames,...ciaNames];
  if(!allNames.length){ alert('Digite ao menos um participante nos campos Onfly ou Cia.'); return; }

  const btn=document.getElementById('v-lookup-btn');
  const resultsDiv=document.getElementById('v-attendee-results');
  btn.textContent='⏳ Buscando...'; btn.disabled=true;
  resultsDiv.style.display='none';

  const myEmail='rodrigo.possatto@onfly.com.br';

  function matches(email, onlyOnfly){
    if(!email||!email.includes('@')) return false;
    const isOnfly=email.endsWith('@onfly.com.br');
    if(onlyOnfly && !isOnfly) return false;
    if(!onlyOnfly && isOnfly) return false;
    return true;
  }

  function bestOf(freq){
    if(!freq.size) return null;
    return [...freq.entries()].sort((a,b)=>b[1]-a[1])[0][0];
  }

  async function searchEmail(name, onlyOnfly){
    async function runQuery(q, fieldsToCheck){
      const r=await window.cowork.callMcpTool('mcp__1eb61ba1-61f6-4a5a-ab01-145ec60b645e__search_threads',{query:q,pageSize:8});
      const threads=(r.structuredContent||JSON.parse((r.content||[{text:'{}'}])[0].text)).threads||[];
      const freq=new Map();
      for(const t of threads)
        for(const m of (t.messages||[])){
          const candidates=fieldsToCheck.flatMap(f=>Array.isArray(m[f])?m[f]:[m[f]||'']).map(s=>String(s).toLowerCase().trim());
          for(const s of candidates){
            if(matches(s,onlyOnfly)||(onlyOnfly&&s===myEmail))
              freq.set(s,(freq.get(s)||0)+1);
          }
        }
      return freq;
    }
    try{
      const f1=await runQuery(`from:"${name}"`,['sender']);
      if(f1.size) return {email:bestOf(f1),label:bestOf(f1)};
      const f2=await runQuery(`to:"${name}"`,['toRecipients','ccRecipients']);
      if(f2.size) return {email:bestOf(f2),label:bestOf(f2)};
      const f3=await runQuery(`"${name}"`,['sender','toRecipients','ccRecipients']);
      if(f3.size) return {email:bestOf(f3),label:bestOf(f3)};
    } catch(e){ console.warn('[lookup] erro "'+name+'": '+e.message); }
    return null;
  }

  const found={};
  await Promise.all([
    ...onlyNames.map(async n=>{ found[n]=await searchEmail(n,true); }),
    ...ciaNames.map(async n=>{ found[n]=await searchEmail(n,false); })
  ]);

  btn.textContent='🔍 Buscar emails dos participantes'; btn.disabled=false;

  let html='<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;font-size:12px">';

  function buildGroup(names, label){
    if(!names.length) return '';
    let s=`<div style="font-weight:600;color:#374151;margin-bottom:4px;margin-top:6px">${label}</div>`;
    for(const name of names){
      const res=found[name];
      const key='email-'+name.replace(/[\s,]/g,'_');
      s+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="min-width:110px">${name}:</span>`;
      if(res){
        s+=`<input type="text" id="${key}" value="${res.email}" style="flex:1;padding:3px 6px;border:1px solid #d1d5db;border-radius:4px;font-size:12px" />`;
      } else {
        s+=`<input type="text" id="${key}" placeholder="não encontrado — cole o email" style="flex:1;padding:3px 6px;border:1px solid #fbbf24;border-radius:4px;font-size:12px;background:#fffbeb" />`;
      }
      s+='</div>';
    }
    return s;
  }

  html+=buildGroup(onlyNames,'👔 Onfly (@onfly.com.br)');
  html+=buildGroup(ciaNames,'✈️ Cia Aérea');
  const allNamesJSON=JSON.stringify(allNames);
  html+=`<button type="button" class="btn btn-primary btn-sm" style="margin-top:6px" onclick="confirmAttendees(${allNamesJSON})">✅ Confirmar emails</button>`;
  html+='</div>';
  resultsDiv.innerHTML=html;
  resultsDiv.style.display='block';
}

function confirmAttendees(names){
  const emails=[];
  for(const name of names){
    const el=document.getElementById('email-'+name.replace(/\s/g,'_'));
    if(el&&el.value.trim()) emails.push(el.value.trim());
  }
  document.getElementById('v-cia-emails').value=emails.join(',');
  document.getElementById('v-attendee-results').innerHTML=
    `<div style="font-size:12px;color:#10b981">✅ ${emails.length} email(s) confirmado(s): ${emails.join(', ')}</div>`;
}

function collectConfirmedEmails(){
  const hidden=document.getElementById('v-cia-emails').value.trim();
  if(hidden) return hidden;
  const resultsDiv=document.getElementById('v-attendee-results');
  if(!resultsDiv||resultsDiv.style.display==='none') return '';
  const inputs=resultsDiv.querySelectorAll('input[type="text"]');
  const emails=[...inputs].map(i=>i.value.trim()).filter(e=>e.includes('@'));
  return emails.join(',');
}

function saveVisit(){
  if(!currentAirline) return;
  const dt=document.getElementById('v-date').value; if(!dt){alert('Data obrigatória');return;}
  const startT=document.getElementById('v-start').value||'09:00';
  const endT=document.getElementById('v-end').value||'10:00';
  const d=getAD(currentAirline), eid=document.getElementById('v-edit-id').value;
  const v={
    id:eid||Date.now().toString(),
    date:dt, start:startT, end:endT,
    local:document.getElementById('v-local').value,
    onfly:document.getElementById('v-onfly').value,
    cia:document.getElementById('v-cia').value,
    ciaEmails:collectConfirmedEmails(),
    pauta:document.getElementById('v-pauta').value,
    resultados:document.getElementById('v-resultados').value,
    proximos:document.getElementById('v-proximos').value,
    followup:document.getElementById('v-followup').value,
    status:document.getElementById('v-status').value
  };
  if(eid){ const i=(d.visits||[]).findIndex(x=>x.id===eid); if(i>=0) d.visits[i]=v; else d.visits.push(v); }
  else { if(!d.visits) d.visits=[]; d.visits.push(v); }
  saveAD(currentAirline,d); closeVisitModal(); renderVisitas();

  // Google Calendar
  if(document.getElementById('v-calendar')?.checked){
    const withMeet=document.getElementById('v-meet')?.checked||false;
    const desc=[(v.pauta?`📋 Pauta: ${v.pauta}`:''),(v.proximos?`➡️ Próximos passos: ${v.proximos}`:'')].filter(Boolean).join('\n\n');
    const allEmails=[
      ...(v.ciaEmails?v.ciaEmails.split(',').map(e=>e.trim()).filter(Boolean):[])
    ];
    const attendees=allEmails.map(email=>({email}));
    const payload={
      summary:`Visita ${currentAirline.trim()} — Sourcing Onfly`,
      startTime:`${v.date}T${startT}:00`,
      endTime:`${v.date}T${endT}:00`,
      location:v.local||'',
      description:desc,
      timeZone:'America/Sao_Paulo',
      addGoogleMeetUrl:withMeet,
      overrideReminders:[{method:'email',minutes:1440},{method:'popup',minutes:30}]
    };
    if(attendees.length) payload.attendees=attendees;
    if(!window.cowork){ alert('⚠️ window.cowork não disponível — reabra o painel.'); return; }
    window.cowork.callMcpTool('mcp__60f6a2c7-cfe7-456a-8ba4-42e31f6e617f__create_event', payload)
      .then(r=>{
        if(!r.isError){
          const res=r.structuredContent||{};
          alert(`✅ Evento criado!\n${res.summary||''}\n${res.htmlLink||''}`);
        } else {
          alert('⚠️ Erro ao criar evento:\n'+(r.content?.[0]?.text||JSON.stringify(r)));
        }
      })
      .catch(e=>{ alert('⚠️ Erro: '+e.message); });
  }
}

function autoFillFromUrl(){
  const urlEl=document.getElementById('m-source');
  const titleEl=document.getElementById('m-title');
  const statusEl=document.getElementById('autofill-status');
  const url=(urlEl?urlEl.value:'').trim();

  if(!url){ return; }
  if(!url.startsWith('http')){ showStatus('⚠️ URL deve começar com http://','#f59e0b'); return; }

  try{
    const u=new URL(url);
    const rawParts=u.pathname.split('/').filter(p=>p.length>0);
    let bestSlug='', bestScore=0;
    for(const part of rawParts){
      const cleaned=part.replace(/\.\w{2,5}$/,'');
      const letters=(cleaned.match(/[a-zA-ZÀ-ÿ]/g)||[]).length;
      const hyphens=(cleaned.match(/-/g)||[]).length;
      if(letters<3) continue;
      const score=letters+(hyphens*4);
      if(score>bestScore){ bestScore=score; bestSlug=cleaned; }
    }

    let title='';
    if(bestSlug && bestScore>=5){
      title=bestSlug
        .replace(/[-_]+/g,' ')
        .replace(/\d{6,}/g,'')
        .replace(/\s+/g,' ')
        .trim()
        .replace(/\b[a-zà-ÿ]/g,c=>c.toUpperCase());
    }

    if(title && title.length>2){
      titleEl.value=title;
      showStatus('✅ Título sugerido — edite se quiser','#10b981');
    } else {
      showStatus('⚠️ Não consegui extrair o título — preencha manualmente','#f59e0b');
    }

    const lc=url.toLowerCase();
    let cat='outro';
    if(/acordo|agreement|incentiv|rebat|parceria|partner|deal/.test(lc)) cat='acordo';
    else if(/rota|route|expan|voo|flight|destino/.test(lc)) cat='expansao';
    else if(/result|lucro|prejui|receita|financ|revenue|profit|faturamento|trimest/.test(lc)) cat='financeiro';
    else if(/concorr|compet|rival|mercado/.test(lc)) cat='concorrencia';
    else if(/anac|regul|licen|autoriza|governo|ministe/.test(lc)) cat='regulatorio';
    document.getElementById('m-cat').value=cat;

    const btn=document.getElementById('autofill-btn');
    btn.textContent=title?'✅ Preenchido!':'⚠️ Sem título';
    setTimeout(()=>{btn.textContent='✨ Auto-preencher';},3000);

  }catch(e){
    showStatus('⚠️ URL inválida: '+e.message,'#ef4444');
  }

  function showStatus(msg,color){
    if(!statusEl) return;
    statusEl.textContent=msg;
    statusEl.style.color=color;
    statusEl.style.display='block';
    setTimeout(()=>{ if(statusEl) statusEl.style.display='none'; },5000);
  }
}
function openMarketModal(){ document.getElementById('m-title').value=''; document.getElementById('m-content').value=''; document.getElementById('m-source').value=''; document.getElementById('m-date').value=new Date().toISOString().split('T')[0]; const ab=document.getElementById('autofill-btn'); ab.textContent='✨ Auto-preencher'; ab.disabled=false; document.getElementById('autofill-loading').style.display='none'; document.getElementById('market-modal').classList.add('open'); }
function closeMarketModal(){ document.getElementById('market-modal').classList.remove('open'); }
function saveMarketNote(){
  if(!currentAirline) return;
  const t=document.getElementById('m-title').value.trim(), cont=document.getElementById('m-content').value.trim();
  if(!t||!cont){alert('Título e conteúdo obrigatórios');return;}
  const d=getAD(currentAirline); if(!d.market) d.market=[];
  d.market.push({id:Date.now().toString(),title:t,cat:document.getElementById('m-cat').value,date:document.getElementById('m-date').value,content:cont,source:document.getElementById('m-source').value});
  saveAD(currentAirline,d); closeMarketModal(); renderMercado();
}
function delNote(id){ if(!confirm('Excluir nota?')) return; const d=getAD(currentAirline); d.market=(d.market||[]).filter(n=>n.id!==id); saveAD(currentAirline,d); renderMercado(); }

// ── Gmail ──────────────────────────────────────────────
async function loadGmail(){
  if(!currentAirline) return;
  const el=document.getElementById('gmail-content');
  if(!el) return;
  const gmailData = (window.__CRM__ || {}).gmail;

  // null → OAuth não configurado no servidor Python
  if(gmailData === null){
    el.innerHTML=`<div style="padding:12px;background:#FFF8E1;border-left:3px solid #FFC107;border-radius:4px;font-size:12px;color:#666">
      <strong>⚙️ Gmail OAuth não configurado</strong><br>
      Execute <code>setup_gmail_oauth.py</code> e adicione as 3 chaves ao <code>.streamlit/secrets.toml</code>.
    </div>`;
    return;
  }

  // Array pré-carregado pelo Python via OAuth
  if(Array.isArray(gmailData)){
    if(!gmailData.length){
      el.innerHTML='<p style="font-size:13px;color:var(--gray)">Nenhum e-mail encontrado para esta cia.</p>';
      return;
    }
    let html='';
    gmailData.forEach(t=>{
      html+=`<div style="border-bottom:1px solid var(--border);padding:10px 0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <strong style="font-size:13px">${t.subject||'(sem assunto)'}</strong>
          <span style="font-size:11px;color:var(--gray);white-space:nowrap;margin-left:8px">${t.date||''}</span>
        </div>
        <div style="font-size:12px;color:var(--blue);margin-top:2px">${t.from||''}</div>
        <div style="font-size:12px;color:var(--gray);margin-top:3px;line-height:1.4">${t.snippet||''}</div>
      </div>`;
    });
    el.innerHTML=html;
    return;
  }

  // undefined / fallback → tenta via cowork
  if(!window.cowork){ el.innerHTML='<p style="font-size:13px;color:var(--gray)">📌 Integração com Gmail disponível apenas no ambiente cowork.</p>'; return; }
  el.innerHTML='<div class="loading"><div class="spinner"></div> Buscando e-mails...</div>';
  const name=currentAirline.trim().split(' ')[0].toLowerCase();
  try{
    const r=await window.cowork.callMcpTool('mcp__1eb61ba1-61f6-4a5a-ab01-145ec60b645e__search_threads',{query:name, pageSize:8});
    const d=r.structuredContent??JSON.parse(r.content[0].text);
    const threads=(d.threads||d||[]);
    if(!threads.length){ el.innerHTML='<p style="font-size:13px;color:var(--gray)">Nenhum e-mail encontrado para esta cia.</p>'; return; }
    let html='';
    threads.forEach(t=>{
      const msgs=t.messages||[];
      const last=msgs[msgs.length-1]||msgs[0]||{};
      const subj=last.subject||last.snippet?.slice(0,60)||'(sem assunto)';
      const from=last.from||last.sender||'';
      const date=last.date||last.internalDate||'';
      const snippet=last.snippet||'';
      html+=`<div style="border-bottom:1px solid var(--border);padding:10px 0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <strong style="font-size:13px">${subj}</strong>
          <span style="font-size:11px;color:var(--gray);white-space:nowrap;margin-left:8px">${date}</span>
        </div>
        <div style="font-size:12px;color:var(--blue);margin-top:2px">${from}</div>
        <div style="font-size:12px;color:var(--gray);margin-top:3px;line-height:1.4">${snippet}</div>
      </div>`;
    });
    el.innerHTML=html;
  }catch(e){ el.innerHTML=`<p style="font-size:13px;color:#ef4444">Erro: ${e.message}</p>`; }
}

// ── Init (dados injetados pelo Streamlit) ──────────────
initPeriod();

currentAirline = __CRM.selectedAirline || null;
if(__CRM.fromDate) document.getElementById('from-month').value = __CRM.fromDate.slice(0,7);
if(__CRM.toDate)   document.getElementById('to-month').value   = __CRM.toDate.slice(0,7);

__asel.innerHTML = '';
(__CRM.airlines||[]).forEach(r=>{

  o.selected = r.a === currentAirline;

});
__asel.onchange = e => { currentAirline = e.target.value || null; };
if(currentAirline && __CRM.transacional) loadTransacional();
